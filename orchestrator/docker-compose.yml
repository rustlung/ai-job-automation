services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ai-job-orchestrator-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/app.db
      WEB_UI_ALLOWED_ORIGINS: ${WEB_UI_ALLOWED_ORIGINS:-}
    volumes:
      - ./data:/app/data
